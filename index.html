<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b11"><title>IWBAM 2.3</title><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f6fb;background:#090b11;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 5%,#192238 0%,transparent 36%),radial-gradient(ellipse at 8% 65%,#211627 0%,transparent 40%),#090b11}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.shell{max-width:510px;margin:auto;min-height:100vh;padding:26px 18px 104px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{display:flex;align-items:center;gap:11px}.brand strong{font-size:23px;letter-spacing:-1px}.muted{color:#9a9cab}.small{font-size:12px}.logo{width:43px;height:43px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(140deg,#ffcf69,#e8952f);box-shadow:0 5px 26px #f9ae4b26}.logo svg{width:30px}.circlebtn{background:#1b1e27;border:1px solid #363944;color:white;border-radius:50%;height:42px;width:42px;font-size:20px}.hero,.panel,.tile,.item{background:linear-gradient(135deg,#25232cbd,#141820e8);border:1px solid #383841;border-radius:23px;box-shadow:0 10px 30px #0002}.hero{padding:23px;margin-bottom:15px;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;right:-75px;top:-95px;width:200px;height:200px;border-radius:50%;background:#f3b64b12;filter:blur(16px);pointer-events:none}.balance{font-size:36px;font-weight:750;letter-spacing:-1.7px;margin:10px 0 20px}.pill{display:inline-flex;gap:6px;align-items:center;border-radius:20px;background:#ffffff0b;border:1px solid #ffffff18;padding:7px 11px;color:#b6b7c2;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.action{border:1px solid #ffffff19;border-radius:17px;padding:17px 12px;font-weight:750;text-align:left;color:white;transition:transform .15s}.action:active,.nav button:active{transform:scale(.96)}.income{background:linear-gradient(125deg,#18372c,#1d262b)}.expense{background:linear-gradient(125deg,#3a252d,#292028)}.action .ico{display:block;font-size:24px;margin-bottom:10px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 12px}.sectionhead h2{font-size:17px;margin:0}.link{background:none;border:0;color:#f7c66d;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{padding:14px 11px;border-radius:17px}.tile b{display:block;font-size:16px;margin-top:7px;overflow-wrap:anywhere}.panel{padding:18px;margin:12px 0}.item{display:flex;align-items:center;gap:12px;padding:13px;margin:9px 0;border-radius:16px}.itemicon{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;border-radius:14px;background:#ffffff10;font-size:20px}.itemmain{flex:1;min-width:0}.itemmain b{display:block;font-size:13px;overflow-wrap:anywhere}.itemmain span{font-size:11px;color:#a5a6b2}.amount{font-size:13px;font-weight:700;white-space:nowrap}.positive{color:#84e0ad}.negative{color:#f4a5ae}.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(calc(100% - 28px),470px);background:#171a23f5;border:1px solid #383a45;border-radius:25px;padding:9px;display:flex;justify-content:space-around;backdrop-filter:blur(20px);z-index:10}.nav button{background:none;border:0;color:#a5a7b6;display:grid;gap:4px;place-items:center;font-size:10px;padding:7px 8px;border-radius:15px;min-width:54px}.nav button span{font-size:19px}.nav button.active{background:#403625;color:#ffce72}.hidden{display:none!important}.btn{border:0;border-radius:14px;padding:13px 17px;background:#f7c467;color:#1c1711;font-weight:750}.btn.secondary{background:#282b35;color:#fff;border:1px solid #454753}.btn.danger{background:#4d2830;color:#ffd1d7}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;color:#c3c4cf}.field input,.field select{width:100%;padding:13px 12px;border-radius:13px;border:1px solid #454650;background:#1b1e27;color:#fff;outline:none}.field input:focus,.field select:focus{border-color:#efbc64}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalwrap{position:fixed;inset:0;background:#000b;z-index:30;display:grid;place-items:center;padding:15px}.modal{width:min(100%,480px);max-height:90vh;overflow:auto;background:#151821;border:1px solid #45434b;border-radius:24px;padding:20px}.modalhead{display:flex;align-items:center;justify-content:space-between}.modalhead h2{margin:0;font-size:19px}.close{background:none;border:0;color:#fff;font-size:26px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.buttons .btn{flex:1}.bar{height:9px;background:#343541;border-radius:10px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e49b39,#fbd377);border-radius:10px}.splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at center,#272031,#090b11 70%);display:grid;place-items:center;transition:opacity .35s}.splash.off{opacity:0;pointer-events:none}.splashinner{text-align:center;animation:rise .8s ease both}.splash .logo{height:100px;width:100px;border-radius:31px;margin:auto auto 18px;box-shadow:0 0 80px #f8bb503b}.splash .logo svg{width:70px}.splash h1{font-size:31px;margin:0}.splash p{color:#a9a5b1;letter-spacing:2px;font-size:10px}@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}.tag{font-size:11px;border-radius:20px;padding:5px 9px;background:#f7c46720;color:#ffd687}.empty{text-align:center;padding:25px;color:#a5a6b2;font-size:13px}.chart{display:flex;align-items:flex-end;gap:9px;height:130px;padding:10px 0}.chartcol{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px;height:100%}.chartcol i{display:block;width:100%;max-width:33px;background:linear-gradient(#ffcc72,#9a6328);border-radius:7px 7px 3px 3px;min-height:3px}.chartcol small{font-size:10px;color:#aaa}.switch{display:flex;align-items:center;justify-content:space-between;gap:15px}.switch input{accent-color:#f7c467;width:19px;height:19px}.note{font-size:12px;color:#a7a9b7;line-height:1.55}.filter{display:flex;gap:8px;overflow:auto;padding:4px 0}.filter button{background:#242630;border:1px solid #454650;color:white;border-radius:20px;padding:8px 12px;white-space:nowrap;font-size:12px}.filter button.selected{background:#f6c36c;color:#17130c}.progressline{display:flex;justify-content:space-between;gap:8px;font-size:12px}.rowend{margin-left:auto}.footer{font-size:11px;text-align:center;color:#686b7a;margin:25px 0}.toast{position:fixed;z-index:60;top:15px;left:50%;transform:translateX(-50%);background:#343328;color:#fff;border:1px solid #d1a455;padding:12px 20px;border-radius:15px;font-size:13px;max-width:90%;text-align:center}
</style></head><body><div class="splash" id="splash"><div class="splashinner"><div class="logo" id="splashlogo"></div><h1>IWBAM</h1><p>YOUR MONEY, YOUR WAY</p></div></div><main class="shell"><header class="top"><div class="brand"><div class="logo" id="brandlogo"></div><div><strong>IWBAM <span style="color:#f4c46d">2.3</span></strong><div class="muted small" id="subtitle">Tu dinero, a tu manera</div></div></div><button class="circlebtn" id="settingsBtn" aria-label="Configuración">⚙</button></header><div id="page"></div><div class="footer">IWBAM · Finanzas personales privadas</div></main><nav class="nav" id="nav"></nav><div id="modalhost"></div><div id="toast" class="toast hidden"></div><script>
(()=>{'use strict';const KEY='iwbam23_data';const logo=`<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 42V22l12 12 9-15 9 15 12-12v20" stroke="#1D1B20" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 49h36" stroke="#1D1B20" stroke-width="5" stroke-linecap="round"/></svg>`;document.getElementById('brandlogo').innerHTML=logo;document.getElementById('splashlogo').innerHTML=logo;setTimeout(()=>{document.getElementById('splash').classList.add('off');setTimeout(()=>document.getElementById('splash').remove(),400)},2000);
const expCats=['🍽️ Alimentación','🚕 Transporte','🎉 Salidas con amigos','🏠 Vivienda','💡 Servicios','🛒 Supermercado','💊 Salud','🎓 Educación','🎮 Entretenimiento','👕 Ropa','💳 Deudas','🎁 Regalos','🐾 Mascotas','✈️ Viajes','📦 Otros'];const incCats=['💼 Salario','🧑‍💻 Trabajo independiente','🏪 Ventas','📈 Inversiones','🎁 Regalos recibidos','↩️ Reembolsos','🏡 Arriendos','📦 Otros'];const defaults=()=>({version:1,currency:'COP',mode:'simple',accounts:[{id:'a1',name:'Efectivo',balance:0},{id:'a2',name:'Banco',balance:0}],transactions:[],budgets:[],goals:[],debts:[],recurring:[],obligations:[],pockets:[],pocketEntries:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('iwbam22_data')||localStorage.getItem('iwbam21_data'))||defaults();if(!Array.isArray(data.accounts)||!Array.isArray(data.transactions))throw Error()}catch{data=defaults()}data={...defaults(),...data};data.obligations=data.obligations||[];data.pockets=Array.isArray(data.pockets)?data.pockets:[];data.pocketEntries=Array.isArray(data.pocketEntries)?data.pocketEntries:[];let page='home',filter='all';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('No se pudo guardar. Comprueba el almacenamiento del navegador.')}};const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString()+Math.random();const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>new Intl.NumberFormat('es-CO',{style:'currency',currency:data.currency||'COP',maximumFractionDigits:2}).format(Number(x)||0);const today=()=>new Date().toLocaleDateString('en-CA');const thisMonth=x=>String(x||'').slice(0,7)===today().slice(0,7);const totals=()=>{let t=data.transactions.filter(x=>thisMonth(x.date));return {inc:t.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp:t.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0)}};const balance=a=>Number(a.balance||0)+data.transactions.reduce((s,t)=>s+(t.type==='income'&&t.account===a.id?t.amount:0)-(t.type==='expense'&&t.account===a.id?t.amount:0)+(t.type==='transfer'&&t.to===a.id?t.amount:0)-(t.type==='transfer'&&t.account===a.id?t.amount:0),0);const sumBalance=()=>data.accounts.reduce((s,a)=>s+balance(a),0);const notify=s=>{let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2700)};const icon=t=>t==='income'?'↙':t==='expense'?'↗':'⇄';const accOpts=()=>data.accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');const field=(name,label,type='text',value='',attrs='')=>`<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${attrs} required></div>`;const select=(name,label,opts,value)=>`<div class="field"><label>${label}</label><select name="${name}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;const accountSelect=(name,label,value)=>`<div class="field"><label>${label}</label><select name="${name}">${data.accounts.map(a=>`<option value="${esc(a.id)}" ${a.id===value?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`;const categorySelect=(type,value)=>select('category','Categoría',(type==='income'?incCats:expCats).map(x=>[x,x]),value);const head=(title,btn='',action='')=>`<div class="sectionhead"><h2>${title}</h2>${btn?`<button class="link" data-act="${action}">${btn}</button>`:''}</div>`;const empty=s=>`<div class="empty">${s}</div>`;const item=t=>`<div class="item"><div class="itemicon">${icon(t.type)}</div><div class="itemmain"><b>${esc(t.type==='transfer'?'Transferencia':t.category)}</b><span>${esc(t.note||t.date)} · ${esc(data.accounts.find(a=>a.id===t.account)?.name||'Cuenta eliminada')}</span></div><div><div class="amount ${t.type==='income'?'positive':t.type==='expense'?'negative':''}">${t.type==='income'?'+':t.type==='expense'?'-':''}${money(t.amount)}</div><button class="link" data-act="editTransaction" data-id="${esc(t.id)}">Editar</button></div></div>`;
function home(){let z=totals(),recent=[...data.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `<section class="hero"><div class="muted small">Balance total</div><div class="balance">${money(sumBalance())}</div><div class="pill">✦ ${data.accounts.length} cuentas conectadas manualmente</div></section><div class="actions"><button class="action income" data-act="income"><span class="ico">↙</span>+ Ingreso<div class="small muted">Registrar dinero recibido</div></button><button class="action expense" data-act="expense"><span class="ico">↗</span>− Egreso<div class="small muted">Registrar un gasto</div></button></div><div class="stats"><div class="tile"><span class="small muted">Ingresos del mes</span><b class="positive">${money(z.inc)}</b></div><div class="tile"><span class="small muted">Gastos del mes</span><b class="negative">${money(z.exp)}</b></div><div class="tile"><span class="small muted">Disponible del mes</span><b>${money(z.inc-z.exp)}</b></div></div>${head('Mis cuentas','Ver todas','accounts')}<div class="grid2">${data.accounts.slice(0,4).map(a=>`<div class="tile"><span class="small muted">🏦 ${esc(a.name)}</span><b>${money(balance(a))}</b></div>`).join('')}</div>${head('Movimientos recientes','Ver todos','transactions')}${recent.length?recent.map(item).join(''):empty('Todavía no tienes movimientos. Registra tu primer ingreso o gasto.')}${data.mode==='advanced'?advancedHome():''}<div class="buttons"><button class="btn secondary" data-page="advanced">📅 Obligaciones</button><button class="btn secondary" data-page="analytics">📊 Estadísticas</button></div>`}
function advancedHome(){let spent=totals().exp,budget=data.budgets.reduce((s,b)=>s+Number(b.limit),0);return `${head('Tu planificación','Herramientas','advanced')}<div class="panel"><div class="progressline"><b>Presupuesto mensual</b><span>${budget?Math.round(spent/budget*100)+'%':'Sin definir'}</span></div><div class="bar"><i style="width:${budget?Math.min(100,spent/budget*100):0}%"></i></div><p class="note">${money(spent)} gastados de ${money(budget)} presupuestados.</p></div>`}
function transactions(){let t=[...data.transactions].sort((a,b)=>b.date.localeCompare(a.date)).filter(x=>filter==='all'||x.type===filter);return `${head('Movimientos','+ Añadir','expense')}<div class="filter">${[['all','Todos'],['income','Ingresos'],['expense','Egresos'],['transfer','Transferencias']].map(([k,v])=>`<button class="${filter===k?'selected':''}" data-act="filter" data-filter="${k}">${v}</button>`).join('')}</div>${t.length?t.map(item).join(''):empty('No hay movimientos en esta categoría.')}<div class="buttons"><button class="btn secondary" data-act="transfer">⇄ Transferir</button><button class="btn secondary" data-act="withdraw">🏧 Retirar efectivo</button></div>`}
function accounts(){return `${head('Mis cuentas','+ Nueva cuenta','newAccount')}${data.accounts.map(a=>`<div class="item"><div class="itemicon">🏦</div><div class="itemmain"><b>${esc(a.name)}</b><span>Saldo actual</span></div><div><b>${money(balance(a))}</b><div><button class="link" data-act="editAccount" data-id="${esc(a.id)}">Editar</button></div></div></div>`).join('')}<p class="note">Los saldos se calculan a partir del saldo inicial y los movimientos. Las transferencias no alteran el balance total.</p>`}
function advanced(){if(data.mode!=='advanced')return `<div class="panel"><h2>Herramientas avanzadas</h2><p class="note">Actívalas en Ajustes cuando quieras controlar presupuestos, metas, obligaciones y análisis.</p><button class="btn" data-act="enableAdvanced">Activar modo avanzado</button></div>`;let z=totals();let cats={};data.transactions.filter(t=>t.type==='expense'&&thisMonth(t.date)).forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);let entries=Object.entries(cats).sort((a,b)=>b[1]-a[1]);let max=Math.max(1,...entries.map(x=>x[1]));return `${head('Análisis financiero')}<button class="btn secondary" style="width:100%" data-page="analytics">📊 Centro de estadísticas completo</button><div class="panel"><div class="muted small">Resultado del mes</div><div class="balance">${money(z.inc-z.exp)}</div><div class="grid2"><div><span class="small muted">Ingresos</span><h3 class="positive">${money(z.inc)}</h3></div><div><span class="small muted">Gastos</span><h3 class="negative">${money(z.exp)}</h3></div></div><h3>Gastos por categoría</h3>${entries.length?entries.map(([c,v])=>`<div style="margin:14px 0"><div class="progressline"><span>${esc(c)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`).join(''):empty('Registra gastos para visualizar su distribución.')}</div>${head('Presupuestos','+ Añadir','newBudget')}${data.budgets.length?data.budgets.map(b=>{let spent=data.transactions.filter(t=>t.type==='expense'&&thisMonth(t.date)&&t.category===b.category).reduce((s,t)=>s+t.amount,0);return `<div class="panel"><div class="progressline"><b>${esc(b.category)}</b><button class="link" data-act="editBudget" data-id="${esc(b.id)}">Editar</button></div><p class="note">${money(spent)} de ${money(b.limit)}</p><div class="bar"><i style="width:${Math.min(100,spent/b.limit*100)}%"></i></div></div>`}).join(''):empty('Crea un límite mensual para cada categoría.')}${head('Metas de ahorro','+ Añadir','newGoal')}${data.goals.length?data.goals.map(g=>`<div class="panel"><div class="progressline"><b>${esc(g.name)}</b><button class="link" data-act="editGoal" data-id="${esc(g.id)}">Editar</button></div><p class="note">${money(g.saved)} de ${money(g.target)} · ${Math.round(g.saved/g.target*100)}%</p><div class="bar"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div><button class="link" data-act="contribute" data-id="${esc(g.id)}">+ Registrar avance</button><p class="note">Meta virtual: no descuenta dinero de tus cuentas.</p></div>`).join(''):empty('Define tu primera meta de ahorro.')}${obligationsView()}${pocketsView()}${head('Pagos recurrentes','+ Añadir','newRecurring')}${data.recurring.length?data.recurring.map(r=>`<div class="item"><div class="itemicon">🔁</div><div class="itemmain"><b>${esc(r.name)}</b><span>Próximo: ${esc(r.next)}</span></div><div><b>${money(r.amount)}</b><button class="link" data-act="payRecurring" data-id="${esc(r.id)}">Registrar pago</button><button class="link" data-act="editRecurring" data-id="${esc(r.id)}">Editar</button></div></div>`).join(''):empty('Los pagos recurrentes solo se registran cuando los confirmas.')}`}
function settings(){return `${head('Preferencias')}<div class="panel"><div class="field"><label>Moneda principal</label><select id="currency">${['COP','USD','EUR','MXN','ARS','CLP','PEN','BRL','GBP','CAD','JPY'].map(c=>`<option ${c===data.currency?'selected':''}>${c}</option>`).join('')}</select></div><div class="switch"><div><b>Modo avanzado</b><p class="note">Presupuestos, metas, obligaciones y análisis.</p></div><input type="checkbox" id="advancedToggle" ${data.mode==='advanced'?'checked':''}></div></div>${head('Tus datos')}<div class="panel"><p class="note">Los datos se guardan en este navegador y dispositivo. No se envían a servidores. Haz copias de seguridad periódicas: borrar datos del navegador puede eliminarlos.</p><div class="buttons"><button class="btn secondary" data-act="export">⬇ Exportar copia</button><button class="btn secondary" data-act="import">⬆ Importar copia</button></div><div class="buttons"><button class="btn danger" data-act="reset">Borrar todos los datos</button></div></div><p class="note">IWBAM 2.3 · Versión de prueba local. Sin conexión bancaria automática ni notificaciones del sistema.</p>`}
function render(){document.getElementById('page').innerHTML=({home,transactions,accounts,advanced,settings,analytics}[page]||home)();let tabs=[['home','⌂','Inicio'],['transactions','⇄','Movimientos'],['accounts','▤','Cuentas'],['advanced','◉','Avanzado'],['analytics','▥','Gráficas'],['settings','⚙','Ajustes']];document.getElementById('nav').innerHTML=tabs.map(([k,i,l])=>`<button data-page="${k}" class="${page===k?'active':''}"><span>${i}</span>${l}</button>`).join('');let c=document.getElementById('currency');if(c)c.onchange=e=>{data.currency=e.target.value;save();render()};let a=document.getElementById('advancedToggle');if(a)a.onchange=e=>{data.mode=e.target.checked?'advanced':'simple';save();render()}}
function modal(title,content,onSubmit){document.getElementById('modalhost').innerHTML=`<div class="modalwrap"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" data-act="close">×</button></div><form id="dialogForm">${content}</form></div></div>`;let form=document.getElementById('dialogForm');if(onSubmit)form.onsubmit=e=>{e.preventDefault();onSubmit(Object.fromEntries(new FormData(form)))};else form.onsubmit=e=>e.preventDefault()};function close(){document.getElementById('modalhost').innerHTML=''}const formBtns=(del=false)=>`<div class="buttons"><button class="btn" type="submit">Guardar</button>${del?'<button type="button" class="btn danger" id="deleteRecord">Eliminar</button>':''}</div>`;
function transactionForm(type='expense',old=null){if(!data.accounts.length){notify('Crea una cuenta primero');return}let editing=!!old;let cats=type==='income'?incCats:expCats;let content=field('amount','Importe','number',old?.amount||'','min="0.01" step="0.01"')+accountSelect('account','Cuenta',old?.account||data.accounts[0].id)+(type==='transfer'?accountSelect('to','Cuenta de destino',old?.to||data.accounts[1]?.id||data.accounts[0].id):categorySelect(type,old?.category||cats[0]))+field('date','Fecha','date',old?.date||today())+field('note','Descripción (opcional)','text',old?.note||'','maxlength="120" required="false"'.replace(' required="false"',''))+formBtns(editing);modal(editing?'Editar movimiento':type==='income'?'Nuevo ingreso':type==='expense'?'Nuevo egreso':'Transferencia',content,f=>{let amount=Number(f.amount);if(!Number.isFinite(amount)||amount<=0)return notify('Introduce un importe válido');if(type==='transfer'&&f.account===f.to)return notify('Elige cuentas diferentes');let t={id:old?.id||id(),type,amount,account:f.account,to:type==='transfer'?f.to:undefined,category:type==='transfer'?'Transferencia':f.category,date:f.date,note:f.note||''};if(editing)data.transactions=data.transactions.map(x=>x.id===old.id?t:x);else data.transactions.push(t);save();close();render();notify('Movimiento guardado')});if(editing)document.getElementById('deleteRecord').onclick=()=>{if(confirm('¿Eliminar este movimiento?')){data.transactions=data.transactions.filter(x=>x.id!==old.id);save();close();render()}};let note=document.querySelector('[name=note]');note.required=false}
function accountForm(old=null){modal(old?'Editar cuenta':'Nueva cuenta',field('name','Nombre de la cuenta','text',old?.name||'','maxlength="50"')+field('balance','Saldo inicial','number',old?.balance??0,'step="0.01"')+formBtns(!!old),f=>{let v=Number(f.balance);if(!Number.isFinite(v))return notify('Saldo inválido');if(old)Object.assign(old,{name:f.name,balance:v});else data.accounts.push({id:id(),name:f.name,balance:v});save();close();render()});if(old)document.getElementById('deleteRecord').onclick=()=>{if(data.transactions.some(t=>t.account===old.id||t.to===old.id))return notify('Esta cuenta tiene movimientos. No se puede eliminar.');if(confirm('¿Eliminar cuenta?')){data.accounts=data.accounts.filter(a=>a.id!==old.id);save();close();render()}}}
function genericForm(kind,old=null){let types={budget:['Presupuesto','budgets'],goal:['Meta de ahorro','goals'],debt:['Obligación','debts'],recurring:['Pago recurrente','recurring']};let [title,key]=types[kind],content='';if(kind==='budget')content=select('category','Categoría',expCats.map(c=>[c,c]),old?.category)+field('limit','Límite mensual','number',old?.limit||'','min="0.01" step="0.01"');if(kind==='goal')content=field('name','Nombre','text',old?.name||'')+field('target','Objetivo','number',old?.target||'','min="0.01" step="0.01"')+field('saved','Ahorrado virtual','number',old?.saved??0,'min="0" step="0.01"');if(kind==='debt')content=field('name','Nombre','text',old?.name||'')+field('amount','Importe pendiente','number',old?.amount||'','min="0.01" step="0.01"')+field('due','Fecha de vencimiento','date',old?.due||today());if(kind==='recurring')content=field('name','Concepto','text',old?.name||'')+field('amount','Importe','number',old?.amount||'','min="0.01" step="0.01"')+field('next','Próximo vencimiento','date',old?.next||today())+accountSelect('account','Cuenta de pago',old?.account||data.accounts[0].id)+select('category','Categoría',expCats.map(c=>[c,c]),old?.category);modal((old?'Editar ':'Nuevo ')+title,content+formBtns(!!old),f=>{let obj={id:old?.id||id(),...f};for(let k of ['amount','limit','target','saved'])if(k in obj){obj[k]=Number(obj[k]);if(!Number.isFinite(obj[k])||obj[k]<(k==='saved'?0:.01))return notify('Revisa los importes')}if(kind==='budget'&&data.budgets.some(b=>b.category===obj.category&&b.id!==obj.id))return notify('Ya existe un presupuesto para esta categoría');if(old)Object.assign(old,obj);else data[key].push(obj);save();close();render()});if(old)document.getElementById('deleteRecord').onclick=()=>{if(confirm('¿Eliminar este registro?')){data[key]=data[key].filter(x=>x.id!==old.id);save();close();render()}}}
function contribute(g){modal('Avance de ahorro',`<p class="note">La meta es un seguimiento virtual. No mueve dinero entre cuentas.</p>${field('amount','Cantidad que quieres sumar','number','','min="0.01" step="0.01"')}${formBtns()}`,f=>{let n=Number(f.amount);if(n<=0||!Number.isFinite(n))return;g.saved=Number(g.saved)+n;save();close();render()})}function payRecurring(r){if(!confirm('¿Confirmas que pagaste '+r.name+' por '+money(r.amount)+'? Se registrará como egreso.'))return;data.transactions.push({id:id(),type:'expense',amount:Number(r.amount),account:r.account,category:r.category,date:today(),note:r.name+' (recurrente)'});let d=new Date(r.next+'T12:00:00');d.setMonth(d.getMonth()+1);r.next=d.toLocaleDateString('en-CA');save();render();notify('Pago registrado')}

// Obligaciones: pagos asociados a movimientos; cada mes fijo es un ciclo independiente.
const monthKey=()=>today().slice(0,7);
const periodOf=(o)=>o.kind==='fixed'?monthKey():'once';
const paidFor=(o,period)=>data.transactions.filter(t=>t.obligationId===o.id&&t.obligationPeriod===period&&t.type==='expense').reduce((n,t)=>n+Number(t.amount),0);
function obligationsView(){let active=data.obligations.filter(o=>(o.kind==='fixed'&&!o.endedAt)||paidFor(o,'once')<Number(o.amount));let total=active.reduce((a,o)=>a+Math.max(0,Number(o.amount)-paidFor(o,periodOf(o))),0);return `${head('Obligaciones','+ Nueva','newObligation')}<div class="panel"><div class="muted small">Pendiente del periodo</div><div class="balance">${money(total)}</div><p class="note">Las obligaciones fijas se renuevan cada mes. Las imprevistas desaparecen de la lista activa cuando están pagadas.</p></div>${active.length?active.map(o=>{let paid=paidFor(o,periodOf(o)),remaining=Math.max(0,o.amount-paid),pct=Math.min(100,paid/o.amount*100);return `<div class="panel"><div class="progressline"><b>${esc(o.name)}</b><span class="tag">${o.kind==='fixed'?'↻ Mensual':'⚡ Imprevista'}</span></div><p class="note">${o.kind==='fixed'?'Día de pago: '+esc(o.day||'Sin definir'):'Pago único'} · ${remaining<=0?'✓ Pagada':'Pendiente '+money(remaining)}</p><div class="bar"><i style="width:${pct}%"></i></div><div class="progressline" style="margin-top:8px"><span>Abonado ${money(paid)}</span><span>${Math.round(pct)}%</span></div><div class="buttons"><button class="btn secondary" data-act="editObligation" data-id="${esc(o.id)}">Editar</button>${o.kind==='fixed'?`<button class="btn secondary" data-act="endObligation" data-id="${esc(o.id)}">✓ Finalizar definitivamente</button>`:''}<button class="btn" data-act="payObligation" data-id="${esc(o.id)}" ${remaining<=0?'disabled':''}>+ Abonar</button></div></div>`}).join(''):empty('No tienes obligaciones pendientes.')}<div class="panel"><b>Historial de obligaciones pagadas</b>${data.obligations.filter(o=>(o.kind==='once'&&paidFor(o,'once')>=o.amount)||(o.kind==='fixed'&&o.endedAt)).map(o=>`<p class="note">✓ ${esc(o.name)} · ${money(o.amount)} ${o.endedAt?'· Finalizada '+esc(o.endedAt):''} <button class="link" data-act="editObligation" data-id="${esc(o.id)}">Ver / editar</button></p>`).join('')||'<p class="note">Todavía no hay obligaciones imprevistas completadas.</p>'}</div>`}
function obligationForm(old=null){modal(old?'Editar obligación':'Nueva obligación',field('name','Nombre','text',old?.name||'','required maxlength="80"')+select('kind','Tipo',[['fixed','Fija · se renueva cada mes'],['once','Imprevista · una sola vez']],old?.kind||'fixed')+field('amount','Importe total por periodo','number',old?.amount??'','required min="0.01" step="0.01"')+field('day','Día de vencimiento (1 a 31; opcional)','number',old?.day||'','min="1" max="31" step="1"')+formBtns(!!old),f=>{let amount=Number(f.amount);if(!f.name.trim()||!Number.isFinite(amount)||amount<=0)return notify('Revisa nombre e importe');if(f.day&&(!Number.isInteger(Number(f.day))||Number(f.day)<1||Number(f.day)>31))return notify('Día inválido');let o={id:old?.id||id(),name:f.name.trim(),kind:f.kind,amount,day:f.day,endedAt:old?.endedAt||null};if(old){if(data.transactions.some(t=>t.obligationId===old.id)&&(old.kind!==o.kind))return notify('No puedes cambiar el tipo después de registrar abonos');Object.assign(old,o)}else data.obligations.push(o);save();close();render();notify('Obligación guardada')});if(old)document.getElementById('deleteRecord').onclick=()=>{if(data.transactions.some(t=>t.obligationId===old.id))return notify('Tiene abonos registrados. Conserva la obligación para mantener el historial.');if(confirm('¿Eliminar obligación?')){data.obligations=data.obligations.filter(o=>o.id!==old.id);save();close();render()}}}
function obligationPay(o){if(!o)return;let period=periodOf(o),remaining=Math.max(0,o.amount-paidFor(o,period));if(!remaining)return notify('Obligación pagada');modal('Abonar · '+esc(o.name),`<p class="note">Pendiente: ${money(remaining)}. El abono se registrará como egreso en la cuenta seleccionada.</p>`+field('amount','Importe del abono','number',remaining,'required min="0.01" step="0.01"')+accountSelect('account','Pagar desde',data.accounts[0]?.id)+field('date','Fecha de pago','date',today())+formBtns(),f=>{let amount=Number(f.amount);if(!Number.isFinite(amount)||amount<=0||amount>remaining+.000001)return notify('El abono debe ser positivo y no superar el pendiente');if(!data.accounts.some(a=>a.id===f.account))return notify('Selecciona una cuenta');if(!f.date)return notify('Selecciona una fecha');data.transactions.push({id:id(),type:'expense',amount,account:f.account,category:'💳 Obligaciones',date:f.date,note:'Abono: '+o.name,obligationId:o.id,obligationPeriod:period});save();close();render();notify('Abono descontado de la cuenta')})}
function withdrawForm(){if(!data.accounts.length)return notify('Crea una cuenta primero');let cash=data.accounts.find(a=>/efectivo|cash/i.test(a.name));if(!cash)return notify('Crea una cuenta Efectivo en Cuentas antes de retirar');modal('Retirar efectivo',`<p class="note">Un retiro es una transferencia de tu banco a efectivo, no un gasto. El saldo total no cambia.</p>`+accountSelect('account','Retirar desde')+select('to','Cuenta de efectivo',data.accounts.filter(a=>/efectivo|cash/i.test(a.name)).map(a=>[a.id,a.name]))+field('amount','Importe','number','','required min="0.01" step="0.01"')+field('date','Fecha','date',today())+formBtns(),f=>{if(!cash)return notify('Crea una cuenta llamada Efectivo primero');let amount=Number(f.amount);if(!amount||amount<=0||!Number.isFinite(amount)||f.account===f.to||!f.to)return notify('Selecciona banco y efectivo diferentes');data.transactions.push({id:id(),type:'transfer',amount,account:f.account,to:f.to,category:'Retiro de efectivo',date:f.date,note:'Retiro de cajero / efectivo'});save();close();render();notify('Retiro registrado')})}

// Bolsillos son reservas dentro de las cuentas reales; nunca constituyen ingresos ni egresos.
const pocketTotal=p=>data.pocketEntries.filter(e=>e.pocketId===p.id).reduce((n,e)=>n+Number(e.amount),0);
const reservedIn=a=>data.pocketEntries.filter(e=>e.account===a).reduce((n,e)=>n+Number(e.amount),0);
const pocketMonth=(p,m)=>data.pocketEntries.filter(e=>e.pocketId===p.id&&e.date?.startsWith(m)).reduce((n,e)=>n+Number(e.amount),0);
function pocketsView(){let months=[...new Set(data.pocketEntries.map(e=>e.date?.slice(0,7)).filter(Boolean))].sort().reverse();return `${head('Bolsillos de ahorro','+ Crear bolsillo','newPocket')}<div class="panel"><div class="muted small">Total reservado en bolsillos</div><div class="balance">${money(data.pockets.reduce((n,p)=>n+pocketTotal(p),0))}</div><p class="note">Los bolsillos reservan parte del dinero de tus cuentas. Ahorrar no genera un egreso ni cambia el balance total. Disponible sin reservar: ${money(sumBalance()-data.pockets.reduce((n,p)=>n+pocketTotal(p),0))}.</p></div>${data.pockets.filter(p=>!p.closedAt).map(p=>{let entries=data.pocketEntries.filter(e=>e.pocketId===p.id),ms=[...new Set(entries.map(e=>e.date.slice(0,7)))].sort().reverse(),total=pocketTotal(p);return `<div class="panel"><div class="progressline"><b>🏦 ${esc(p.name)}</b><span class="tag">${p.kind==='fixed'?'↻ Fijo':'⚡ Imprevisto'}</span></div><div class="balance" style="font-size:25px">${money(total)}</div><p class="note">${p.target>0?'Meta: '+money(p.target)+' · '+Math.round(total/p.target*100)+'%':'Sin meta definida'}</p>${p.target>0?`<div class="bar"><i style="width:${Math.min(100,Math.max(0,total/p.target*100))}%"></i></div>`:''}<div class="buttons"><button class="btn" data-act="pocketDeposit" data-id="${esc(p.id)}">+ Ahorrar</button><button class="btn secondary" data-act="pocketWithdraw" data-id="${esc(p.id)}" ${total<=0?'disabled':''}>Liberar dinero</button><button class="btn secondary" data-act="editPocket" data-id="${esc(p.id)}">Editar</button></div><p class="note"><b>Historial mensual</b></p>${ms.length?ms.map(m=>`<div class="progressline" style="margin:9px 0"><span>${esc(m)}</span><b>${money(pocketMonth(p,m))}</b></div>`).join(''):'<p class="note">Todavía no hay aportes.</p>'}<p class="note">Reservado en: ${data.accounts.filter(a=>entries.some(e=>e.account===a.id)).map(a=>`${esc(a.name)} (${money(entries.filter(e=>e.account===a.id).reduce((n,e)=>n+e.amount,0))})`).join(' · ')||'Sin asignar'}</p></div>`}).join('')||empty('Crea tu primer bolsillo de ahorro.')}<div class="panel"><b>Bolsillos finalizados</b><p class="note">${data.pockets.filter(p=>p.closedAt).map(p=>esc(p.name)+' · '+esc(p.closedAt)).join(' · ')||'Ninguno todavía.'}</p></div>`}
function pocketForm(old=null){modal(old?'Editar bolsillo':'Nuevo bolsillo',field('name','Nombre del bolsillo','text',old?.name||'','maxlength="80"')+select('kind','Tipo',[['fixed','Fijo · ahorro continuo'],['once','Imprevisto · objetivo puntual']],old?.kind||'fixed')+field('target','Meta total (opcional)','number',old?.target??0,'min="0" step="0.01"')+formBtns(!!old),f=>{let target=Number(f.target);if(!f.name.trim()||!Number.isFinite(target)||target<0)return notify('Revisa nombre y meta');if(old)Object.assign(old,{name:f.name.trim(),kind:f.kind,target});else data.pockets.push({id:id(),name:f.name.trim(),kind:f.kind,target});save();close();render();notify('Bolsillo guardado')});if(old){document.getElementById('deleteRecord').onclick=()=>{if(pocketTotal(old)>0)return notify('Libera todo el dinero antes de eliminar');if(confirm('¿Eliminar este bolsillo y su historial?')){data.pockets=data.pockets.filter(p=>p.id!==old.id);data.pocketEntries=data.pocketEntries.filter(e=>e.pocketId!==old.id);save();close();render()}};if(!old.closedAt){let b=document.createElement('button');b.className='btn secondary';b.textContent='Finalizar bolsillo';b.onclick=()=>{if(pocketTotal(old)>0)return notify('Libera el dinero reservado antes de finalizar');if(confirm('¿Finalizar este bolsillo?')){old.closedAt=today();save();close();render()}};document.querySelector('.modal .buttons')?.append(b)}}}
function pocketMove(p,withdraw=false){if(!p||p.closedAt)return;let options=withdraw?data.accounts.filter(a=>reservedPocketIn(p,a.id)>0):data.accounts;if(!options.length)return notify('No hay cuentas disponibles');let total=pocketTotal(p);modal(withdraw?'Liberar ahorro':'Añadir ahorro',`<p class="note">${withdraw?'Libera dinero reservado, sin registrar ingresos.':'Aparta dinero que ya existe en tu cuenta, sin registrar un gasto.'}</p>`+select('account','Cuenta',options.map(a=>[a.id,`${a.name} · ${money(withdraw?reservedPocketIn(p,a.id):balance(a)-reservedIn(a.id))}`]))+field('amount','Importe','number','','min="0.01" step="0.01"')+field('date','Fecha','date',today())+formBtns(),f=>{let amount=Number(f.amount),a=data.accounts.find(a=>a.id===f.account);if(!a||!Number.isFinite(amount)||amount<=0||!f.date)return notify('Revisa el importe y la cuenta');let available=withdraw?reservedPocketIn(p,a.id):balance(a)-reservedIn(a.id);if(amount>available+0.000001)return notify('No hay suficiente dinero disponible en esa cuenta');data.pocketEntries.push({id:id(),pocketId:p.id,account:a.id,amount:withdraw?-amount:amount,date:f.date});save();close();render();notify(withdraw?'Dinero liberado':'Ahorro reservado')})}
const reservedPocketIn=(p,account)=>data.pocketEntries.filter(e=>e.pocketId===p.id&&e.account===account).reduce((n,e)=>n+Number(e.amount),0);

function analytics(){let all=data.transactions,month=monthKey(),tx=all.filter(t=>t.date?.startsWith(month)),income=tx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),expense=tx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),obpaid=tx.filter(t=>t.obligationId).reduce((s,t)=>s+t.amount,0),obpending=data.obligations.filter(o=>(o.kind==='fixed'&&!o.endedAt)||paidFor(o,'once')<o.amount).reduce((s,o)=>s+Math.max(0,o.amount-paidFor(o,periodOf(o))),0);let groups={};tx.filter(t=>t.type==='expense').forEach(t=>groups[t.category||'Otros']=(groups[t.category||'Otros']||0)+t.amount);let list=Object.entries(groups).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...list.map(x=>x[1]));let periods=Array.from({length:6},(_,i)=>{let d=new Date(Number(month.slice(0,4)),Number(month.slice(5))-1-i,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}).reverse();let rows=periods.map(m=>({m,inc:all.filter(t=>t.date?.startsWith(m)&&t.type==='income').reduce((s,t)=>s+t.amount,0),exp:all.filter(t=>t.date?.startsWith(m)&&t.type==='expense').reduce((s,t)=>s+t.amount,0)}));let peak=Math.max(1,...rows.flatMap(r=>[r.inc,r.exp]));return `${head('Centro de estadísticas')}<div class="stats"><div class="tile"><span class="small muted">Ingresos</span><b class="positive">${money(income)}</b></div><div class="tile"><span class="small muted">Egresos</span><b class="negative">${money(expense)}</b></div><div class="tile"><span class="small muted">Balance total</span><b>${money(sumBalance())}</b></div></div><div class="panel"><h3>Ingresos vs. egresos · últimos 6 meses</h3><div class="chart" style="height:180px">${rows.map(r=>`<div class="chartcol"><div style="display:flex;align-items:end;gap:3px;height:130px"><i title="Ingresos ${money(r.inc)}" style="height:${Math.max(3,r.inc/peak*125)}px;background:linear-gradient(#77d8a7,#277a57);width:13px"></i><i title="Egresos ${money(r.exp)}" style="height:${Math.max(3,r.exp/peak*125)}px;background:linear-gradient(#ffcb71,#a86c2c);width:13px"></i></div><small>${r.m.slice(5)}</small></div>`).join('')}</div><p class="note">🟢 Ingresos · 🟡 Egresos. Toca o mantén pulsadas las barras para ver importes.</p></div><div class="panel"><h3>Obligaciones del periodo</h3><div class="grid2"><div><span class="muted small">Abonado este mes</span><h3 class="positive">${money(obpaid)}</h3></div><div><span class="muted small">Pendiente actual</span><h3 class="negative">${money(obpending)}</h3></div></div><div class="bar"><i style="width:${obpaid+obpending?Math.min(100,obpaid/(obpaid+obpending)*100):0}%"></i></div><button class="link" data-page="advanced">Gestionar obligaciones</button></div><div class="panel"><h3>Distribución de egresos por categoría</h3>${list.length?list.map(([cat,v])=>`<div style="margin:14px 0"><div class="progressline"><span>${esc(cat)}</span><b>${money(v)} · ${expense?Math.round(v/expense*100):0}%</b></div><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`).join(''):empty('Registra egresos para ver estadísticas.')}</div><div class="panel"><h3>Ahorro por bolsillo</h3>${data.pockets.map(p=>`<div class="progressline" style="margin:12px 0"><span>${esc(p.name)}</span><b>${money(pocketTotal(p))}</b></div>`).join('')||empty('No hay bolsillos todavía.')}</div><div class="panel"><h3>Resumen de cuentas</h3>${data.accounts.map(a=>`<div class="progressline" style="margin:12px 0"><span>${esc(a.name)}</span><b>${money(balance(a))}</b></div>`).join('')}</div><p class="note">Los gráficos usan movimientos registrados manualmente. No representan información bancaria en tiempo real.</p>`}

function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='IWBAM_respaldo_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function importData(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{let x=JSON.parse(await input.files[0].text());if(!x||!Array.isArray(x.accounts)||!Array.isArray(x.transactions)||!Array.isArray(x.budgets)||!Array.isArray(x.goals)||!Array.isArray(x.debts)||!Array.isArray(x.recurring))throw Error();if(!confirm('¿Reemplazar todos los datos actuales con este respaldo?'))return;data={...defaults(),...x};if(!Array.isArray(data.obligations))data.obligations=[];if(!Array.isArray(data.pockets))data.pockets=[];if(!Array.isArray(data.pocketEntries))data.pocketEntries=[];save();render();notify('Respaldo importado')}catch{notify('El archivo no es un respaldo compatible')}};input.click()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();window.scrollTo(0,0);return}let b=e.target.closest('[data-act]');if(!b)return;let act=b.dataset.act,ident=b.dataset.id;let find=(key)=>data[key].find(x=>x.id===ident);if(act==='close')return close();if(act==='income'||act==='expense'||act==='transfer')return transactionForm(act);if(act==='withdraw')return withdrawForm();if(act==='newObligation')return obligationForm();if(act==='endObligation'){let o=find('obligations');if(o&&o.kind==='fixed'&&!o.endedAt&&confirm('¿Finalizar definitivamente esta obligación? No volverá a renovarse. Los pagos anteriores se conservarán.')){o.endedAt=today();save();render();notify('Obligación finalizada')}return}if(act==='newPocket')return pocketForm();if(act==='editPocket')return pocketForm(find('pockets'));if(act==='pocketDeposit')return pocketMove(find('pockets'));if(act==='pocketWithdraw')return pocketMove(find('pockets'),true);if(act==='editObligation')return obligationForm(data.obligations.find(o=>o.id===ident));if(act==='payObligation')return obligationPay(data.obligations.find(o=>o.id===ident));if(act==='filter'){filter=b.dataset.filter;return render()}if(['home','transactions','accounts','advanced','analytics','settings'].includes(act)){page=act;render();return}if(act==='newAccount')return accountForm();if(act==='editAccount')return accountForm(find('accounts'));if(act==='editTransaction'){let t=find('transactions');if(t.obligationId)return notify('Este pago está vinculado a una obligación; gestiona sus abonos desde Obligaciones.');return transactionForm(t.type,t)}if(act==='enableAdvanced'){data.mode='advanced';save();render();return}if(act==='export')return exportData();if(act==='import')return importData();if(act==='reset'){if(confirm('Esto borrará TODOS tus datos de IWBAM de este navegador. ¿Continuar?')){data=defaults();save();page='home';render()}}for(let kind of ['Budget','Goal','Debt','Recurring']){if(act==='new'+kind){if(kind==='Debt')return obligationForm();return genericForm(kind.toLowerCase());}if(act==='edit'+kind){if(kind==='Debt')return obligationForm(find('debts'));return genericForm(kind.toLowerCase(),find(({Budget:'budgets',Goal:'goals',Debt:'debts',Recurring:'recurring'})[kind]))}}if(act==='contribute')return contribute(find('goals'));if(act==='payRecurring')return payRecurring(find('recurring'))});document.getElementById('settingsBtn').onclick=()=>{page='settings';render()};render();})();
</script></body></html>
